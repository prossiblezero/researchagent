name: Offline acceptance
on: [push, pull_request]
jobs:
  acceptance:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OFFLINE_MODE: '1'
      PYTHONUTF8: '1'
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python evals/run_all.py
      - run: python evals/run_v1_eval.py --output evals/reports/v1-ci.json
      - run: python evals/run_v2_eval.py --output evals/reports/v2-ci.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-${{ matrix.os }}
          path: |
            evals/reports/v1-ci.json
            data/v1-eval/
            evals/reports/v2-ci.json
            data/v2-eval/
